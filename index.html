<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Челик Анализатор</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #17212b;
    color: #ffffff;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.app {
    max-width: 420px;
    margin: auto;
}

.logo {
    text-align: center;
    font-size: 65px;
    margin-top: 30px;
}

h1 {
    text-align: center;
    margin: 10px 0;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #8d9aa6;
    margin-bottom: 25px;
}

.card {
    background: #202b36;
    border-radius: 24px;
    padding: 22px;
}

label {
    display: block;
    color: #aeb9c2;
    font-size: 14px;
    margin: 15px 0 7px;
}

input {
    width: 100%;
    height: 52px;
    border: none;
    outline: none;
    border-radius: 14px;
    background: #253442;
    color: white;
    padding: 0 15px;
    font-size: 16px;
}

button {
    width: 100%;
    height: 52px;
    margin-top: 22px;
    border: none;
    border-radius: 15px;
    background: #2ea6ff;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

#analysis,
#result {
    display: none;
    text-align: center;
}

.loader {
    font-size: 55px;
    animation: spin 1s infinite;
    margin: 20px;
}

@keyframes spin {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

.status {
    color: #8d9aa6;
    margin: 15px 0;
}

.progress {
    height: 6px;
    background: #34424e;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #2ea6ff;
    transition: width .3s;
}

.result-icon {
    font-size: 55px;
}

.result-name {
    font-size: 25px;
    font-weight: bold;
    margin-top: 10px;
}

.result-box {
    background: #253442;
    border-radius: 18px;
    padding: 20px;
    margin-top: 20px;
}

.result-text {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.4;
    margin-top: 10px;
}

.stats {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.stat {
    flex: 1;
    background: #202b36;
    padding: 15px 5px;
    border-radius: 15px;
}

.number {
    color: #2ea6ff;
    font-size: 20px;
    font-weight: bold;
}

.small {
    color: #8d9aa6;
    font-size: 11px;
    margin-top: 5px;
}

.again {
    background: #34424e;
}

.footer {
    text-align: center;
    color: #687783;
    font-size: 11px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">🧪</div>

    <h1>Челик Анализатор</h1>

    <div class="subtitle">
        Научно необоснованный анализ человека
    </div>

    <div class="card">

        <div id="form">

            <label>👤 Имя человека</label>

            <input
                id="name"
                type="text"
                placeholder="Например, Саша"
            >

            <label>🎂 Возраст</label>

            <input
                id="age"
                type="number"
                placeholder="Например, 23"
            >

            <button onclick="startAnalysis()">
                🔬 ПРОВЕСТИ АНАЛИЗ
            </button>

        </div>


        <div id="analysis">

            <div class="loader">
                🧠
            </div>

            <h2>
                Проводим исследование...
            </h2>

            <div
                class="status"
                id="status"
            >
                Подключение к мозгу...
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    id="bar"
                ></div>
            </div>

        </div>


        <div id="result">

            <div class="result-icon">
                🧪
            </div>

            <div
                class="result-name"
                id="resultName"
            ></div>

            <div
                class="result-box"
            >

                <div>
                    РЕЗУЛЬТАТ ИССЛЕДОВАНИЯ
                </div>

                <div
                    class="result-text"
                    id="resultText"
                ></div>

            </div>

            <div class="stats">

                <div class="stat">
                    <div
                        class="number"
                        id="idiot"
                    ></div>

                    <div class="small">
                        уровень долбоебизма
                    </div>
                </div>

                <div class="stat">
                    <div
                        class="number"
                        id="danger"
                    ></div>

                    <div class="small">
                        опасность
                    </div>
                </div>

            </div>

            <button
                class="again"
                onclick="location.reload()"
            >
                🔄 Анализировать ещё раз
            </button>

        </div>

    </div>

    <div class="footer">
        Результаты абсолютно недостоверны 😂
    </div>

</div>


<script>

const results = [

"профессиональный долбоёб по результатам независимой экспертизы.",
"официально подозрительный человек.",
"имеет критически низкий уровень адекватности.",
"слишком много думает о всякой хуете.",
"в целом нормальный. Но это не точно.",
"опасно близок к званию главного долбоёба месяца.",
"выглядит как человек, который скажет «я всё объясню».",
"обладает уникальной способностью принимать странные решения.",
"эксперты отказались давать комментарии.",
"имеет признаки хронического долбоебизма.",
"слишком уверенно делает хуйню.",
"система обнаружила подозрительно высокий уровень тупняка.",
"ментально всё ещё находится в 2017 году.",
"вероятность нормального решения крайне низкая.",
"способен испортить даже идеально спланированный день.",
"опасно харизматичный идиот.",
"человек-загадка. Даже он сам не знает, что происходит.",
"по документам человек. По поведению есть вопросы.",
"система не смогла определить уровень адекватности.",
"рекомендуется держать под наблюдением.",
"мозг работает. Иногда.",
"имеет талант находить проблемы там, где их не существовало.",
"вероятность того, что он опять что-нибудь выкинет — 100%.",
"слишком подозрительно нормальный.",
"обнаружено чрезмерное количество странных решений.",
"потенциально хороший человек, но расследование продолжается.",
"имеет лицензию на совершение хуйню.",
"с научной точки зрения объяснить его поведение невозможно.",
"мозг загружен на 12%. Остальные 88% заняты хернёй.",
"исследование завершено. Результат лучше никому не показывать."

];


const statuses = [
"Подключение к мозгу...",
"Проверяем адекватность...",
"Сканируем историю странных решений...",
"Проверяем здравый смысл...",
"Сравниваем с базой долбоёбов...",
"Оцениваем опасность...",
"Запрашиваем мнение экспертов...",
"Формируем заключение..."
];


function startAnalysis() {

    const name =
        document.getElementById("name").value.trim();

    const age =
        document.getElementById("age").value.trim();

    if (!name) {
        alert("Введите имя 😭");
        return;
    }

    if (!age) {
        alert("Введите возраст 😭");
        return;
    }


    document.getElementById("form")
        .style.display = "none";

    document.getElementById("analysis")
        .style.display = "block";


    let step = 0;

    const timer = setInterval(function() {

        document.getElementById("status")
            .textContent = statuses[step];

        document.getElementById("bar")
            .style.width =
            ((step + 1) / statuses.length * 100) + "%";

        step++;

        if (step >= statuses.length) {

            clearInterval(timer);

            setTimeout(function() {

                showResult(name, age);

            }, 500);
        }

    }, 450);
}


function showResult(name, age) {

    const random =
        Math.floor(
            Math.random() * results.length
        );

    const idiot =
        Math.floor(
            Math.random() * 31
        ) + 70;

    const danger =
        Math.floor(
            Math.random() * 51
        ) + 35;


    document.getElementById("analysis")
        .style.display = "none";

    document.getElementById("result")
        .style.display = "block";


    document.getElementById("resultName")
        .textContent =
        name + ", " + age + " лет";


    document.getElementById("resultText")
        .textContent =
        results[random];


    document.getElementById("idiot")
        .textContent =
        idiot + "%";


    document.getElementById("danger")
        .textContent =
        danger + "%";
}

</script>

</body>
</html>
