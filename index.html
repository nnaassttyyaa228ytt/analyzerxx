<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Анализатор</title>
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
min-height: 100vh;
font-family: Arial, sans-serif;
background: #f3f3f3;
display: flex;
justify-content: center;
align-items: center;
}
.container {
width: 90%;
max-width: 500px;
background: white;
padding: 30px;
border-radius: 25px;
box-shadow: 0 10px 30px rgba(0,0,0,0.12);
text-align: center;
}
.main-image {
width: 100%;
max-width: 350px;
height: auto;
border-radius: 20px;
display: block;
margin: 0 auto 25px;
}
h1 {
margin: 0 0 20px;
font-size: 28px;
}
textarea {
width: 100%;
height: 120px;
resize: none;
padding: 15px;
border: 2px solid #ddd;
border-radius: 15px;
font-size: 16px;
outline: none;
margin-bottom: 15px;
}
textarea:focus {
border-color: #888;
}
button {
width: 100%;
padding: 15px;
border: none;
border-radius: 15px;
background: #111;
color: white;
font-size: 17px;
cursor: pointer;
margin-top: 10px;
}
button:hover {
background: #333;
}
button:active {
transform: scale(0.98);
}
#result {
margin-top: 20px;
padding: 15px;
border-radius: 15px;
background: #f0f0f0;
min-height: 50px;
font-size: 16px;
line-height: 1.5;
}
</style>
</head>
<body>
<div class="container">
<!-- КАРТИНКА -->
<img src="analyzer.jpg.jpg" alt="Анализатор" class="main-image">
<h1>Анализатор</h1>
<textarea
id="textInput"
placeholder="Введите текст для анализа..."
></textarea>
<button onclick="analyzeText()">
Анализировать
</button>
<div id="result">
Здесь появится результат
</div>
</div>
<script>
function analyzeText() {
const text = document.getElementById("textInput").value.trim();
const result = document.getElementById("result");
if (text === "") {
result.innerHTML = "Сначала введи текст 😭";
return;
}
const words = text.split(/\s+/).length;
const characters = text.length;
result.innerHTML =
"🔎 Анализ завершён!<br><br>" +
"Количество слов: <b>" + words + "</b><br>" +
"Количество символов: <b>" + characters + "</b>";
}
</script>
</body>
</html>
