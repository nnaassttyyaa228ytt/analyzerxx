<div class="analysis-title">
            Проводим исследование...
        </div>

        <div
            class="analysis-status"
            id="analysisStatus"
        >
            Подключение к мозгу...
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

    </div>


    <!-- RESULT -->

    <div id="result">

        <div class="result-icon">
            🧪
        </div>

        <div
            class="result-name"
            id="resultName"
        ></div>

        <div
            class="result-age"
            id="resultAge"
        ></div>


        <div class="result-box">

            <div class="result-label">
                Результат исследования
            </div>

            <div
                class="result-text"
                id="resultText"
            ></div>

        </div>


        <div class="stats">

            <div class="stat">

                <div
                    class="stat-number"
                    id="idiotPercent"
                >
                </div>

                <div class="stat-label">
                    уровень долбоебизма
                </div>

            </div>


            <div class="stat">

                <div
                    class="stat-number"
                    id="dangerPercent"
                >
                </div>

                <div class="stat-label">
                    опасность для общества
                </div>

            </div>

        </div>


        <button
            class="again"
            onclick="resetGame()"
        >
            🔄 Анализировать ещё раз
        </button>

    </div>

</div>


<div class="footer">
    Результаты являются абсолютно недостоверными<br>
    и не имеют никакого отношения к науке.
</div>
